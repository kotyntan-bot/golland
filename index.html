<title>Тест Голланда</title>
<style>
  body { font-family: sans-serif; background: #f5f7fa; margin: 0; padding: 16px; }
  .container { max-width: 700px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
  .progress { height: 8px; background: #e5e9f0; border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
  .progress-bar { height: 100%; background: #4a7cff; width: 0%; transition: width 0.3s; }
  .pair { border: 1px solid #e5e9f0; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .pair-num { font-size: 12px; color: #999; margin-bottom: 8px; }
  .option {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border: 1px solid #e5e9f0; border-radius: 8px;
    cursor: pointer; margin-bottom: 8px; background: #fff;
    transition: all 0.15s;
  }
  .option:hover { border-color: #4a7cff; background: #f5f8ff; }
  .option.selected { border-color: #4a7cff; background: #eaf0ff; font-weight: 500; }
  .letter { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: #e5e9f0; color: #666; font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .option.selected .letter { background: #4a7cff; color: #fff; }
  .option-text { flex: 1; }
  .info-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    background: #e5e9f0; color: #4a7cff; font-size: 13px; font-weight: 700;
    border: none; cursor: pointer; flex-shrink: 0;
    transition: background 0.15s;
  }
  .info-btn:hover { background: #4a7cff; color: #fff; }
  .btn { display: block; width: 100%; padding: 14px; margin-top: 20px; background: #4a7cff; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn:disabled { background: #c5cfe0; cursor: not-allowed; }
  .type-name { font-size: 26px; font-weight: 700; color: #4a7cff; margin: 8px 0 16px; }
  .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .score-item { display: flex; justify-content: space-between; padding: 8px 12px; background: #f5f7fa; border-radius: 8px; font-size: 14px; }
  .score-item.top { background: #eaf0ff; font-weight: 600; }
  .desc { font-size: 15px; color: #333; margin-bottom: 16px; }
  .prof { font-size: 14px; color: #555; margin-bottom: 12px; }
  .close-types { font-size: 13px; color: #777; }
  .back { display: inline-block; margin-top: 20px; color: #4a7cff; cursor: pointer; }

  /* Модальное окно с описанием */
  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4); z-index: 100;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; padding: 24px;
    max-width: 480px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    position: relative;
  }
  .modal h3 { margin: 0 0 10px; font-size: 18px; color: #1a1a1a; }
  .modal p { margin: 0; font-size: 15px; color: #444; line-height: 1.5; }
  .modal-close {
    position: absolute; top: 12px; right: 16px;
    background: none; border: none; font-size: 24px; color: #999;
    cursor: pointer; line-height: 1;
  }
  .modal-close:hover { color: #333; }
</style>

    html += '<span class="letter">А</span>';
    html += '<span class="option-text">' + profA + '</span>';
    html += '<button class="info-btn" data-prof="' + profA.replace(/"/g, '&quot;') + '" title="Что это за профессия?">ⓘ</button>';
    html += '</div>';

    html += '<div class="option ' + (chosen === 'B' ? 'selected' : '') + '" data-num="' + num + '" data-choice="B">';
    html += '<span class="letter">В</span>';
    html += '<span class="option-text">' + profB + '</span>';
    html += '<button class="info-btn" data-prof="' + profB.replace(/"/g, '&quot;') + '" title="Что это за профессия?">ⓘ</button>';
    html += '</div>';

    html += '</div>';
  }

  html += '</div>';
  html += '<button class="btn" id="finishBtn" disabled>Ответьте на все 42 пары</button>';
  app.innerHTML = html;

  // Клик по варианту — выбор
  var opts = document.querySelectorAll('.option');
  for (var j = 0; j < opts.length; j++) {
    opts[j].addEventListener('click', function(e) {
      // если кликнули на иконку — не выбираем
      if (e.target.classList.contains('info-btn')) return;
      var num = this.getAttribute('data-num');
      var choice = this.getAttribute('data-choice');
      answers[num] = choice;
      var siblings = document.querySelectorAll('.option[data-num="' + num + '"]');
      for (var k = 0; k < siblings.length; k++) siblings[k].classList.remove('selected');
      this.classList.add('selected');
      updateProgress();
    });
  }

  // Клик по иконке — показать описание
  var infos = document.querySelectorAll('.info-btn');
  for (var m = 0; m < infos.length; m++) {
    infos[m].addEventListener('click', function(e) {
      e.stopPropagation();
      var prof = this.getAttribute('data-prof');
      var text = DESCRIPTIONS[prof] || 'Описание пока не добавлено.';
      document.getElementById('modalTitle').textContent = prof;
      document.getElementById('modalText').textContent = text;
      document.getElementById('modalOverlay').classList.add('active');
    });
  }

  document.getElementById('finishBtn').addEventListener('click', showResult);
  updateProgress();
}

function updateProgress() {
  var count = Object.keys(answers).length;
  document.getElementById('progressBar').style.width = (count / 42 * 100) + '%';
  var btn = document.getElementById('finishBtn');
  if (count === 42) {
    btn.disabled = false;
    btn.textContent = 'Узнать результат';
  } else {
    btn.disabled = true;
    btn.textContent = 'Ответьте на все 42 пары (' + count + '/42)';
  }
}

function calculate() {
  var scores = {};
  for (var i = 0; i < ORDER.length; i++) {
    var t = ORDER[i];
    var s = 0;
    for (var j = 0; j < KEYS[t].length; j++) {
      var num = KEYS[t][j][0];
      var letter = KEYS[t][j][1];
      if (answers[num] === letter) s++;
    }
    scores[t] = s;
  }
  return scores;
}

function showResult() {
  var scores = calculate();
  var maxType = ORDER[0];
  for (var i = 0; i < ORDER.length; i++) {
    if (scores[ORDER[i]] > scores[maxType]) maxType = ORDER[i];
  }
  var type = TYPES[maxType];

  var scoresHtml = '';
  for (var j = 0; j < ORDER.length; j++) {
    var t = ORDER[j];
    var cls = (t === maxType) ? 'score-item top' : 'score-item';
    scoresHtml += '<div class="' + cls + '"><span>' + t + '. ' + LABELS[t] + '</span><span>' + scores[t] + '</span></div>';
  }

  var html = '<h1>Ваш профессиональный тип:</h1>';
  html += '<div class="type-name">' + maxType + '. ' + type.name + '</div>';
  html += '<div class="scores">' + scoresHtml + '</div>';
  html += '<div class="desc">' + type.desc + '</div>';
  html += '<div class="prof"><b>Рекомендуемые профессии:</b> ' + type.prof + '.</div>';
  html += '<div class="close-types">' + type.close + '</div>';
  html += '<div class="back" id="backLink">← Пройти ещё раз</div>';

  app.innerHTML = html;

  document.getElementById('backLink').addEventListener('click', function() {
    answers = {};
    renderTest();
    window.scrollTo(0, 0);
  });
  window.scrollTo(0, 0);
}

// Закрытие модального окна
document.getElementById('modalClose').addEventListener('click', function() {
  document.getElementById('modalOverlay').classList.remove('active');
});
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('active');
});

renderTest();
</script>
</body>
</html>
